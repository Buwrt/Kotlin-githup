plugins {
    id 'com.android.application'
    /*
     * 接入 Kotlin。Java 与 Kotlin 可以同目录混编：
     * Kotlin 编译器和 javac 都会扫同一套源文件，互相调用无需任何胶水代码。
     * 这是「逐个文件迁移」能成立的前提 —— 不用等哪天整体重写完才能编译。
     */
    id 'org.jetbrains.kotlin.android'
}

/*
 * ---- 版本锁定 ----
 *
 * 版本号由仓库根目录的 version.lock 钉死：这里的值必须和它一致，
 * 不一致直接构建失败。
 *
 * 目的是杜绝「顺手把版本号改了」—— 1.1.4 那次就是这么来的：
 * build.gradle 改了，防护链常量（GuardKeys）没跟上，包一启动就被
 * 官方校验拦下。现在改成「必须先改 version.lock」这样一个显式的、
 * 单独的动作，改版本再也绕不过去。
 */
def lockProps = [:]
def lockFile = rootProject.file('version.lock')
if (lockFile.exists()) {
    lockFile.eachLine { line ->
        def s = line.trim()
        if (!s || s.startsWith('#')) return
        def kv = s.split('=', 2)
        if (kv.length == 2) lockProps[kv[0].trim()] = kv[1].trim()
    }
}
ext.LOCK_NAME = lockProps['version'] ?: ''
ext.LOCK_CODE = lockProps['versionCode'] ?: ''

android {
    namespace 'com.hubmobile.app'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.hubmobile.app'
        minSdk 24
        targetSdk 34
        versionCode 1002016
        versionName '1.2.16'
    }

    signingConfigs {
        // 正式签名：只属于本项目的密钥。
        // 口令与密钥文件放在 keystore/ 下且已被 .gitignore 排除 —— 绝不能进仓库，
        // 否则任何人拿到它就能签一个「同名同包」的假 APK 冒充更新。
        release {
            def ks = rootProject.file('keystore/githup-release.jks')
            def pf = rootProject.file('keystore/pass.txt')
            if (ks.exists() && pf.exists()) {
                storeFile ks
                storePassword pf.text.trim()
                keyAlias 'githup'
                keyPassword pf.text.trim()
            } else {
                // 密钥不在（比如别人 clone 了仓库）：退回 debug 签名，
                // 只影响自己本地能不能装，不影响你发布的包。
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            /*
              本库是「未加密未加固」版本：不开混淆、不删资源，
              反编译出来就是能读的源码，方便对照阅读。
              加固与混淆只在 Buwrt/githup 那个库里做。
            */
            minifyEnabled false
            shrinkResources false
            // 用专属密钥签，不再是人人可用的 debug 签名
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /*
     * Kotlin 的字节码目标版本必须显式指定，否则默认停在 1.8，
     * 与上面的 Java 17 对不齐 —— 混编时两边版本不一致会被 AGP 拦下。
     */
    kotlinOptions {
        jvmTarget = '17'
        /* Kotlin 1.9 默认开启 -Xjvm-default=all 会改变接口默认方法的生成方式，
         * 本项目没有 Kotlin 接口带默认实现，保持默认即可，不额外开开关。 */
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
        /*
         * 路线 B：启用 Compose 编译器。
         *
         * 注意这只是「允许写 Compose」，不代表界面已经原生化 ——
         * assets/web 下的网页 UI 依然在，两者会长期共存：
         *   已迁移的页面 → Compose（原生渲染）
         *   未迁移的页面 → 继续走 WebView
         * 这样做的好处是可以一个页面一个页面地换，不用等整体重写完才能发版。
         */
        compose true
    }

    /*
     * Compose 编译器版本必须和 Kotlin 版本严格对得上，否则直接编译失败：
     *   Kotlin 1.9.20 → Compose Compiler 1.5.4
     *   Kotlin 1.9.24 → Compose Compiler 1.5.8   ← 本项目
     *
     * 这里踩过一次：先写的 1.5.4，CI 报
     *   "This version (1.5.4) of the Compose Compiler requires Kotlin 1.9.20
     *    but you appear to be using Kotlin 1.9.24"
     * 同属 1.9.x 也不行 —— 编译器是按小版本逐个对齐的，不能想当然。
     * 兼容对照表：developer.android.com/jetpack/androidx/releases/compose-kotlin
     *
     * 哪天升到 Kotlin 2.0，编译器版本要一起升（且 AGP 需先到 8.2+）。
     */
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

// ---- 版本锁定校验：与 version.lock 对不上就别想构建 ----
if (ext.LOCK_NAME || ext.LOCK_CODE) {
    def actualName = String.valueOf(android.defaultConfig.versionName)
    def actualCode = String.valueOf(android.defaultConfig.versionCode)
    if (ext.LOCK_NAME && actualName != ext.LOCK_NAME) {
        throw new GradleException(
            "\n[版本锁定] 构建脚本里的 versionName 是 '${actualName}'，version.lock 锁的是 '${ext.LOCK_NAME}'。\n"
            + "版本号已锁定，不允许改动。确需发新版：先改 version.lock，再改这里，最后重跑 tools/gen-guard.py。")
    }
    if (ext.LOCK_CODE && actualCode != ext.LOCK_CODE) {
        throw new GradleException(
            "\n[版本锁定] 构建脚本里的 versionCode 是 '${actualCode}'，version.lock 锁的是 '${ext.LOCK_CODE}'。\n"
            + "版本号已锁定，不允许改动。确需发新版：先改 version.lock，再改这里，最后重跑 tools/gen-guard.py。")
    }
}
logger.lifecycle("[版本锁定] versionName=${android.defaultConfig.versionName} versionCode=${android.defaultConfig.versionCode}（已与 version.lock 核对一致）")

/*
 * 依赖说明（Kotlin 迁移后 · 路线 B 起有变化）——
 *
 *   Kotlin 插件会自动把 kotlin-stdlib 加进来，不需要手写这一行；
 *   写出来反而容易和插件自带的版本打架（两边版本不一致会报 duplicate class）。
 *
 *   语言迁移阶段（路线 A）做到的是：除 stdlib 之外零第三方依赖，
 *   不引 OkHttp、不引 Gson、不引 androidx，网络层 Http.kt 是自己手写的。
 *
 *   路线 B（UI 原生化）必须打破这一条 —— Compose 本身就是 androidx 库，
 *   没有「手写一套 Compose」的可能。所以从这里开始引入依赖；
 *   换来的是界面不再由 WebView 渲染。
 *
 *   选依赖时仍然守住两条：
 *     1. 不引 OkHttp / Retrofit / Gson —— 继续用 Http.kt + org.json（框架自带）
 *     2. 不引 Coil / Glide —— 头像用 Http.requestRaw 拿字节后 BitmapFactory 解码
 *   即：只在「UI 框架」这一处让步，能力层依然零第三方。
 *
 *   BOM 统一管理 Compose 各子库版本，避免 ui / material3 / runtime 互相打架。
 */
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation composeBom

    // Compose 的宿主必须是 ComponentActivity（Manifest 里 MainActivity 是普通 Activity，
    // 所以路线 B 另起 ComposeHostActivity，不去动 MainActivity 的现有行为）
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // LaunchedEffect / Dispatchers.IO 需要：网络请求不能跑在主线程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

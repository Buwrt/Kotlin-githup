org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
# 路线 B 之前是 false —— 那时项目零 androidx 依赖（网络/存储/加密全部自己写）。
# Compose 本身就是 androidx 库，引入后这一项必须为 true，否则 AGP 会在
# mergeNativeLibs 阶段直接报错拒绝打包：
#   "contains AndroidX dependencies, but android.useAndroidX is not enabled"
# Jetifier 依然不开：Compose 全是新版 androidx，没有需要改写的旧 support 库。
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

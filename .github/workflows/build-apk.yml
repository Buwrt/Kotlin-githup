name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Assemble
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Sign release APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -alias githup-ui \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass githup-ui -keypass githup-ui \
            -dname "CN=githup-ui, OU=ci, O=githup, L=, S=, C=CN"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          "$BT/zipalign" -f -v 4 "$UNSIGNED" app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks ci-release.jks --ks-key-alias githup-ui \
            --ks-pass pass:githup-ui --key-pass pass:githup-ui \
            --out githup-ui-1.0.0-release.apk \
            app-release-aligned.apk
          "$BT/apksigner" verify githup-ui-1.0.0-release.apk

      - name: Copy APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/githup-ui-1.0.0-debug.apk
          cp githup-ui-1.0.0-release.apk out/
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: githup-ui-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure
          path: app/build/reports
          if-no-files-found: ignore

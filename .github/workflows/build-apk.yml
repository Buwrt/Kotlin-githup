name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 已预装 Android SDK，不再用第三方 setup action
      # （android-actions/setup-android 在很多仓库上会直接失败）
      - name: 看一眼预装的 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: 构建 Debug 包
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/githup-ui-debug.apk
          sha256sum apk/githup-ui-debug.apk | cut -d' ' -f1 > apk/githup-ui-debug.apk.sha256
          echo "=== 产物 ==="
          ls -lh apk/

      - name: 上传为 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: githup-ui-debug-apk
          path: apk/githup-ui-debug.apk
          retention-days: 30

      - name: 把 APK 提交回仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk
          if git diff --quiet --cached; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: 更新构建产物 APK（$(date -u +%Y-%m-%dT%H:%M:%SZ)）"
            git push origin HEAD:main
          fi

      - name: 发布到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 已存在就跳过，不覆盖也不失败
          gh release view v1.0.0 >/dev/null 2>&1 && exit 0
          gh release create v1.0.0 apk/githup-ui-debug.apk \
            --title "githup UI v1.0.0" \
            --notes "Kotlin + Jetpack Compose 复刻的 githup 界面，debug 包，可直接安装试看。"

# 云端构建：编 Debug / Release APK，并通过 REST API 把产物与构建日志直接写回仓库
# （绕开无法直接下载 Actions 日志/产物的限制）。
name: Build Debug APK (log)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: Kotlin-githup
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        id: d
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        id: r
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # 日志与 APK 都走 Contents API 写回仓库。
      #
      # 为什么不用 gh api：文件已存在时必须带 sha 才能覆盖，gh 的 -f 参数
      # 不会自动补，于是第二次之后每次都 422；加上 set -e，一步失败就
      # 把后面的 APK 提交一起跳过了 —— 表现是「编译成功却没有包」。
      # 改用 Python 显式取 sha 再 PUT，且失败不中断（continue-on-error）。
      - name: Commit logs and APKs via API
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import base64, glob, hashlib, json, os, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = os.environ["OWNER"], os.environ["REPO"], os.environ["BRANCH"]
          RUN = os.environ.get("GITHUB_RUN_NUMBER", "0")
          API = "https://api.github.com"


          def api_put(path, data, msg):
              """写一个文件到仓库；已存在时先取 sha 才能覆盖。"""
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "ci"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      sha = json.loads(z.read().decode()).get("sha")
                  if sha:
                      body["sha"] = sha
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ci"})
              try:
                  with urllib.request.urlopen(req, timeout=240) as z:
                      print("uploaded", path, len(data), "bytes")
              except urllib.error.HTTPError as e:
                  print("FAILED", path, e.code, e.read().decode()[:300])


          # 1) 构建日志（尾部 400 行）
          for f in ("build-debug.log", "build-release.log"):
              try:
                  raw = open(f, "rb").read()
              except FileNotFoundError:
                  raw = b"(empty)\n"
              tail = b"\n".join(raw.split(b"\n")[-400:])
              api_put(f"ci/{f}", tail, f"ci: 构建日志 {f} (run {RUN})")

          # 2) APK + sha256
          for variant, d, name in [
              ("debug", "app/build/outputs/apk/debug", "githup-debug.apk"),
              ("release", "app/build/outputs/apk/release", "githup-release.apk"),
          ]:
              apks = sorted(glob.glob(d + "/*.apk"))
              if not apks:
                  print("no", variant, "apk")
                  continue
              src = apks[0]
              blob = open(src, "rb").read()
              print("uploading", variant, src, len(blob), "bytes")
              api_put(f"apk/{name}", blob, f"ci: {variant} APK (run {RUN})")
              api_put(f"apk/{name}.sha256",
                      (hashlib.sha256(blob).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")
          PYEOF

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: githup-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

# 云端构建：编 Debug / Release APK，并通过 REST API 把产物与构建日志直接写回仓库
# （绕开无法直接下载 Actions 日志/产物的限制）。
name: Build Debug APK (log)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: Kotlin-githup
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        id: d
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        id: r
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit logs via API
        run: |
          set -e
          for f in build-debug.log build-release.log; do
            [ -f "$f" ] || echo "(empty)" > "$f"
            tail -n 400 "$f" > "tail-$f"
            gh api -X PUT "repos/$OWNER/$REPO/contents/ci/$f" \
              -f message="ci: 构建日志 $f (run ${GITHUB_RUN_NUMBER})" \
              -f branch="$BRANCH" \
              -F content=@"tail-$f" 2>/dev/null \
              || gh api -X PUT "repos/$OWNER/$REPO/contents/ci/$f" \
                   -f message="ci: 构建日志 $f (run ${GITHUB_RUN_NUMBER})" \
                   -f branch="$BRANCH" \
                   -f content="$(base64 -w0 tail-$f)"
          done
          echo "logs committed"

      - name: Commit APKs via API
        run: |
          python3 - <<'PYEOF'
          import base64, glob, hashlib, json, os, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = os.environ["OWNER"], os.environ["REPO"], os.environ["BRANCH"]
          API = "https://api.github.com"


          def api_put(path, data, msg):
              """用 Contents API 写一个文件；已存在时先取 sha 才能覆盖。"""
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "ci"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      sha = json.loads(z.read().decode()).get("sha")
                  if sha:
                      body["sha"] = sha
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ci"})
              try:
                  with urllib.request.urlopen(req, timeout=240) as z:
                      print("uploaded", path, len(data), "bytes")
              except urllib.error.HTTPError as e:
                  print("FAILED", path, e.code, e.read().decode()[:300])


          # 产物名固定，与 App 内更新检测拼直链时用的名字一致
          for variant, d, name in [
              ("debug", "app/build/outputs/apk/debug", "githup-debug.apk"),
              ("release", "app/build/outputs/apk/release", "githup-release.apk"),
          ]:
              apks = sorted(glob.glob(d + "/*.apk"))
              if not apks:
                  print("no", variant, "apk")
                  continue
              src = apks[0]
              blob = open(src, "rb").read()
              print("uploading", variant, src, len(blob), "bytes")
              api_put(f"apk/{name}", blob, f"ci: {variant} APK (run {os.environ['GITHUB_RUN_NUMBER']})")
              api_put(f"apk/{name}.sha256",
                      (hashlib.sha256(blob).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")
          PYEOF

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: githup-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90
